<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Maze Memory</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="danger" class="hidden"></div>
  <div id="rear" class="hidden"><span>Bakom dig</span></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-row">
      <span id="hud-level">Bana 1</span>
      <span id="hud-lives">❤❤❤❤❤</span>
      <span id="hud-wrong">✗ 0</span>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="hud-phase">Studera kartan</div>
  </div>

  <button id="leave" class="round hidden" aria-label="Lämna banan">✕</button>
  <div id="hint" class="hidden"></div>
  <button id="ready" class="hidden">Jag är redo</button>
  <button id="back-study" class="round hidden" aria-label="Tillbaka till menyn">←</button>
  <button id="peek-close" class="hidden">Stäng kartan</button>
  <button id="tilt" class="round hidden" aria-label="Ändra vinkeln på kartan">◢</button>

  <div id="compass" class="hidden"><div id="needle"><span>N</span></div><span id="peek-count" class="hidden"></span></div>

  <div id="controls" class="hidden">
    <button data-rel="left" aria-label="Vänster">←</button>
    <button data-rel="forward" aria-label="Rakt fram">↑</button>
    <button data-rel="right" aria-label="Höger">→</button>
    <button id="hide" class="hide hidden">Göm dig i tunnan</button>
    <button id="unhide" class="hide hidden">Kom fram</button>
    <button data-rel="back" aria-label="Vänd tillbaka" class="back">↩ Vänd</button>
  </div>

  <!-- Meny: bankarta -->
  <div id="menu" class="menu">
    <div class="menu-top">
      <button id="hero-btn" class="round" aria-label="Välj figur"><span id="hero-emoji">👦</span></button>
      <div class="menu-title">
        <h1>Maze Memory</h1>
        <div class="menu-stats"><span id="stat-stars">★ 0</span><span id="stat-lives">❤ 5</span></div>
      </div>
      <button id="settings-btn" class="round" aria-label="Inställningar">⚙</button>
    </div>

    <div id="map" class="map"><div id="map-inner" class="map-inner"></div></div>

    <div class="menu-bottom">
      <div id="lvl-info" class="info"></div>
      <button id="play" class="primary">Spela</button>
    </div>
  </div>

  <!-- Inställningar -->
  <div id="sheet-settings" class="panel sheet hidden">
    <h1>Inställningar</h1>

    <h2>Spelläge</h2>
    <div class="seg" id="seg-mode">
      <button data-v="navigator" class="on">Navigator<small>Hitta vägen själv</small></button>
      <button data-v="memory">Memory<small>Vägen är markerad</small></button>
    </div>

    <h2>Tempo</h2>
    <div class="seg" id="seg-diff">
      <button data-v="easy">Lugnt</button>
      <button data-v="medium" class="on">Normalt</button>
      <button data-v="hard">Snabbt</button>
    </div>

    <details>
      <summary>Testinställningar</summary>
      <label>Labyrintstorlek (rutor per sida, 0 = enligt bana)
        <input id="dbg-size" type="number" min="0" max="40" value="0">
      </label>
      <label>Studietid (sek, 0 = enligt tempo)
        <input id="dbg-study" type="number" min="0" max="120" value="0">
      </label>
      <label>Kameravridning (grader/sek, lägre = lugnare)
        <input id="dbg-cam" type="number" min="10" max="360" step="5" value="60">
      </label>
      <label>Vändning (grader/sek, högre = snabbare)
        <input id="dbg-uturn" type="number" min="60" max="720" step="20" value="280">
      </label>
      <label>Tidsgräns, faktor
        <input id="dbg-time" type="number" min="0.3" max="5" step="0.1" value="1">
      </label>
      <label>Lås upp kikar (5 st)
        <input id="dbg-peeks" type="checkbox">
      </label>
      <label>Lås upp alla figurer
        <input id="dbg-unlock" type="checkbox">
      </label>
      <button id="reset-save">Nollställ sparad progress</button>
    </details>

    <button id="settings-close" class="primary">Klar</button>
  </div>

  <!-- Välj figur -->
  <div id="sheet-hero" class="panel sheet hidden">
    <h1>Välj figur</h1>
    <p id="hero-stars" class="tag"></p>
    <div id="hero-grid" class="hero-grid"></div>
    <button id="hero-close" class="primary">Klar</button>
  </div>

  <!-- Förklaringar och frågor -->
  <div id="dialog" class="hidden">
    <div class="dialog-card">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-buttons">
        <button id="dialog-secondary" class="hidden"></button>
        <button id="dialog-primary" class="primary">Okej</button>
      </div>
    </div>
  </div>

  <!-- Resultat -->
  <div id="result" class="panel hidden">
    <h1 id="res-title"></h1>
    <div id="res-stars" class="stars big"></div>
    <p id="res-text"></p>
    <button id="res-next" class="primary">Nästa bana</button>
    <button id="res-again">Spela om</button>
    <button id="res-menu">Meny</button>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
